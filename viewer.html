    font-size: 0.85rem;

    font-family: inherit;

  .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: #fb923c; }

  /* SIDEBAR */

  .nav-type {

    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .nav-title-wrap { flex: 1; overflow: hidden; }
  .nav-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* MAIN */
  .main { margin-left: 240px; padding: 2rem 2.5rem 4rem; max-width: 1400px; }

  .filters {
    display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap;

<script>
let DATA = null;
let activeFilter = 'all';

async function load() {
  const inlineEl = document.getElementById('inline-data');
  if (inlineEl) {
    DATA = JSON.parse(inlineEl.textContent);
  } else {
    const res = await fetch('./etapas.json');
    DATA = await res.json();
  }

  const dataCapturaEl = document.getElementById('meta');
  dataCapturaEl.textContent = `${DATA.total_etapas} etapas · capturado em ${new Date().toLocaleDateString('pt-BR')}`;

  renderFilters();
  renderNav();
  renderCards();
  renderSummary();
}

function tipoCategoria(tipo) {
  if (!tipo) return 'outra';
  const t = tipo.toLowerCase();
  if (t.includes('landing')) return 'landing';
  if (t.includes('quiz')) return 'quiz';
  if (t.includes('loading')) return 'loading';
  if (t.includes('email')) return 'email';
  if (t.includes('paywall') || t.includes('checkout')) return 'paywall';
  if (t.includes('proof') || t.includes('framing') || t.includes('stats') || t.includes('validação') || t.includes('story')) return 'persuasao';
  return 'outra';
}

const COR_CATEGORIA = {
  landing: '#3b82f6',
  quiz: '#a78bfa',
  loading: '#eab308',
  email: '#06b6d4',
  paywall: '#22c55e',
  persuasao: '#ec4899',
  outra: '#6b7280'
};

function renderFilters() {
  const container = document.getElementById('filters');
  const tipos = new Set();
  DATA.etapas.forEach(e => tipos.add(tipoCategoria(e.analise?.tipo)));

  const labels = {
    all: 'Todas',
    landing: '🏠 Landing',
    quiz: '❓ Quiz',
    persuasao: '💬 Persuasão',
    loading: '⏳ Loading',
    email: '✉️ Email gate',
    paywall: '💳 Paywall',
    outra: '· Outra'
  };

  container.innerHTML = '';
  Object.keys(labels).forEach(k => {
    if (k !== 'all' && !tipos.has(k)) return;
    const b = document.createElement('button');
    b.className = 'filter-chip' + (k === 'all' ? ' active' : '');
    b.dataset.filter = k;
    b.textContent = labels[k];
    b.onclick = () => setFilter(k);
    container.appendChild(b);
  });
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.filter === f);
  });
  renderCards();
}

function renderNav() {
  const list = document.getElementById('nav-list');
  list.innerHTML = '';
  DATA.etapas.forEach(e => {
    const cat = tipoCategoria(e.analise?.tipo);
    const a = document.createElement('a');
    a.className = 'nav-item';
    a.href = '#etapa-' + e.numero;
    a.innerHTML = `
      <span class="nav-num">${String(e.numero).padStart(2, '0')}</span>
      <div class="nav-title-wrap">
        <div class="nav-title">${escapeHtml(e.analise?.headline?.slice(0, 30) || 'Etapa ' + e.numero)}</div>
        <div class="nav-type" style="color:${COR_CATEGORIA[cat]}">${escapeHtml(e.analise?.tipo || '')}</div>
      </div>
    `;
    list.appendChild(a);
  });
}

function renderCards() {
  const cont = document.getElementById('cards');
  cont.innerHTML = '';
  DATA.etapas.forEach((e, i) => {
    const cat = tipoCategoria(e.analise?.tipo);
    if (activeFilter !== 'all' && cat !== activeFilter) return;

    const card = document.createElement('div');
    card.className = 'etapa-card';
    card.id = 'etapa-' + e.numero;
    card.innerHTML = `
      <div>
        <div class="etapa-numero">${String(e.numero).padStart(2, '0')}</div>
        <div class="etapa-num-label">Etapa</div>
      </div>
      <div class="etapa-screenshot">
        <img src="./${e.arquivo}" alt="Screenshot etapa ${e.numero}" onclick="openModal('./${e.arquivo}')" loading="lazy">
        <div class="badge-zoom">click p/ zoom</div>
      </div>
      <div class="etapa-analise">
        <span class="etapa-tipo" style="color:${COR_CATEGORIA[cat]};background:${COR_CATEGORIA[cat]}22">${escapeHtml(e.analise?.tipo || '')}</span>
        <h2>${escapeHtml(e.analise?.headline || '(sem headline)')}</h2>
        ${e.analise?.subheadline ? `<div class="field">
          <div class="field-label">Sub / copy de apoio</div>
          <div class="field-value quote">${escapeHtml(e.analise.subheadline)}</div>
        </div>` : ''}
        ${e.analise?.cta ? `<div class="field">
          <div class="field-label">CTA</div>
          <div class="field-value"><strong>${escapeHtml(e.analise.cta)}</strong></div>
        </div>` : ''}
        ${e.analise?.mecanismo ? `<div class="field">
          <div class="field-label">Mecanismo de persuasão</div>
          <div class="field-value mech">${escapeHtml(e.analise.mecanismo)}</div>
        </div>` : ''}
        ${e.analise?.observacoes ? `<div class="field">
          <div class="field-label">Observações</div>
          <div class="field-value obs">${escapeHtml(e.analise.observacoes)}</div>
        </div>` : ''}
        <p class="etapa-url">${escapeHtml(e.url || '')}</p>
        <div class="actions">
          <button class="copy-btn" onclick="copyCopy(this, ${e.numero})">📋 Copiar copy bruta</button>
          <button class="copy-btn" onclick="copyAnalysis(this, ${e.numero})">📊 Copiar análise</button>
        </div>
      </div>
    `;
    cont.appendChild(card);

    // conector
    if (i < DATA.etapas.length - 1) {
      const conn = document.createElement('div');
      conn.className = 'conector';
      conn.textContent = '↓';
      cont.appendChild(conn);
    }
  });
}

function renderSummary() {
  const grid = document.getElementById('summary-grid');
  const tipos = {};
  const ctas = [];
  DATA.etapas.forEach(e => {
    const t = e.analise?.tipo || '?';
    tipos[t] = (tipos[t] || 0) + 1;
    if (e.analise?.cta && !ctas.includes(e.analise.cta)) ctas.push(e.analise.cta);
  });

  const html = [
    `<div class="stat"><div class="stat-num">${DATA.total_etapas}</div><div class="stat-label">etapas mapeadas</div></div>`,
    `<div class="stat"><div class="stat-num">${Object.keys(tipos).length}</div><div class="stat-label">tipos distintos</div></div>`,
    `<div class="stat"><div class="stat-num">${ctas.length}</div><div class="stat-label">CTAs únicos</div></div>`,
    `<div class="stat" style="grid-column:span 2"><div class="stat-label" style="margin-bottom:8px">Distribuição por tipo</div>${Object.entries(tipos).map(([t, n]) => `<div style="font-size:0.82rem;color:#ccc;margin:2px 0">• ${escapeHtml(t)} <span style="color:#f97316;font-weight:600">×${n}</span></div>`).join('')}</div>`,
    `<div class="stat" style="grid-column:span 2"><div class="stat-label" style="margin-bottom:8px">CTAs identificados</div>${ctas.map(c => `<div style="font-size:0.82rem;color:#ccc;margin:2px 0">→ ${escapeHtml(c)}</div>`).join('')}</div>`,
  ].join('');
  grid.innerHTML = html;
}

function openModal(src) {
  const m = document.getElementById('modal');
  document.getElementById('modal-img').src = src;
  m.classList.add('active');
}

function closeModal(ev) {
  if (ev && ev.target && ev.target.tagName === 'IMG' && ev.target.id === 'modal-img') return;
  document.getElementById('modal').classList.remove('active');
}

function copyCopy(btn, num) {
  const e = DATA.etapas.find(x => x.numero === num);
  navigator.clipboard.writeText(e.texto || '').then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓ Copiado';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 Copiar copy bruta'; }, 1500);
  });
}

function copyAnalysis(btn, num) {
  const e = DATA.etapas.find(x => x.numero === num);
  const a = e.analise || {};
  const txt = `ETAPA ${num}
- Tipo: ${a.tipo}
- Headline: "${a.headline}"
- Sub: "${a.subheadline}"
- CTA: "${a.cta}"
- Mecanismo: ${a.mecanismo}
- Observações: ${a.observacoes}`;
  navigator.clipboard.writeText(txt).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓ Copiado';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📊 Copiar análise'; }, 1500);
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// Active nav highlight on scroll
function setupScrollSpy() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const id = en.target.id.replace('etapa-', '');
        document.querySelectorAll('.nav-item').forEach(n => {
          n.classList.toggle('active', n.getAttribute('href') === '#etapa-' + id);
        });
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('.etapa-card').forEach(c => observer.observe(c));
}

// Escape closes modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal').classList.remove('active');
});

load().then(() => setTimeout(setupScrollSpy, 100));
</script>

</body>
</html>
